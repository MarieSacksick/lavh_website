name: Deploy to Production (Strato SFTP)

on:
  push:
    branches: ['prod']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy via SFTP
        env:
          SFTP_HOST: '51474257.ssh.w1.strato.hosting'
          SFTP_PORT: '22'
          SFTP_USER: ${{ secrets.SFTP_MARIE_LAVH_EMAIL }}
          SSHPASS: ${{ secrets.SFTP_MARIE_LAVH_PWD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          cd out
          sshpass -e sftp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -P "$SFTP_PORT" "$SFTP_USER@$SFTP_HOST" <<'EOF'
          put -r .
          bye
          EOF
